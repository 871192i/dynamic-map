<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Map App</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    #map { height: 100vh; width: 100%; z-index: 1; }
    .sidebar { z-index: 1000; }
  </style>
</head>
<body class="bg-gray-100 flex flex-col md:flex-row h-screen overflow-hidden">

  <!-- Sidebar ด้านซ้าย -->
  <div class="sidebar w-full md:w-80 bg-white p-4 shadow-lg flex flex-col gap-4 overflow-y-auto h-auto md:h-full">
    <h1 class="text-xl font-bold text-gray-800">🗺️ แอปแผนที่ปักหมุด</h1>
    <p class="text-xs text-gray-500">คลิกที่จุดใดก็ได้บนแผนที่เพื่อเพิ่มหมุดใหม่</p>

    <!-- ตัวกรองหมวดหมู่ -->
    <div>
      <label class="text-sm font-semibold text-gray-700">เลือกหมวดหมู่:</label>
      <select id="categoryFilter" class="w-full mt-1 p-2 border rounded-lg text-sm bg-gray-50" onchange="filterMarkers()">
        <option value="all">ทั้งหมด</option>
        <option value="cafe">☕ ร้านกาแฟ</option>
        <option value="ev">⚡ สถานี EV</option>
        <option value="travel">🏔️ สถานที่ท่องเที่ยว</option>
      </select>
    </div>

    <hr>

    <!-- รายการหมุดทั้งหมด -->
    <div>
      <h2 class="text-sm font-semibold text-gray-700 mb-2">หมุดทั้งหมด (<span id="locationCount">0</span>)</h2>
      <div id="locationList" class="space-y-2 max-h-60 md:max-h-96 overflow-y-auto"></div>
    </div>
  </div>

  <!-- พื้นที่แสดงแผนที่ -->
  <div class="flex-1 relative">
    <div id="map"></div>
  </div>

  <script>
    // เริ่มต้นระบบแผนที่
    const map = L.map('map').setView([13.7563, 100.5018], 13);

    // ภาพแผนที่ฟรีจาก OpenStreetMap มาตรฐาน
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    let markersData = [
      { id: 1, name: "ร้านกาแฟสุขใจ", category: "cafe", lat: 13.7563, lng: 100.5018, desc: "กาแฟดี บรรยากาศเงียบสงบ" },
      { id: 2, name: "จุดชาร์จ EV พญาไท", category: "ev", lat: 13.7590, lng: 100.5350, desc: "ชาร์จไว 120kW มี 4 ช่อง" }
    ];

    let currentMarkersOnMap = [];

    function renderMarkers(data) {
      currentMarkersOnMap.forEach(m => map.removeLayer(m));
      currentMarkersOnMap = [];

      const listContainer = document.getElementById('locationList');
      listContainer.innerHTML = '';
      document.getElementById('locationCount').innerText = data.length;

      data.forEach(item => {
        const marker = L.marker([item.lat, item.lng]).addTo(map);
        marker.bindPopup(`
          <div class="p-1">
            <h3 class="font-bold text-base text-blue-600">${item.name}</h3>
            <p class="text-xs text-gray-600 mt-1">${item.desc}</p>
            <span class="inline-block mt-2 px-2 py-0.5 text-xs bg-gray-100 rounded border">หมวดหมู่: ${item.category}</span>
          </div>
        `);
        currentMarkersOnMap.push(marker);

        const card = document.createElement('div');
        card.className = "p-3 border rounded-lg bg-gray-50 hover:bg-blue-50 cursor-pointer transition";
        card.innerHTML = `
          <h4 class="font-bold text-sm text-gray-800">${item.name}</h4>
          <p class="text-xs text-gray-500">${item.desc}</p>
        `;
        card.onclick = () => {
          map.flyTo([item.lat, item.lng], 16);
          marker.openPopup();
        };
        listContainer.appendChild(card);
      });
    }

    map.on('click', function(e) {
      const lat = e.latlng.lat.toFixed(4);
      const lng = e.latlng.lng.toFixed(4);

      const name = prompt(`เพิ่มสถานที่ใหม่ตรงพิกัด (${lat}, ${lng}):\nกรุณาพิมพ์ชื่อสถานที่`);
      if (!name) return;

      const desc = prompt("พิมพ์รายละเอียดสั้นๆ:") || "ไม่มีรายละเอียด";
      const category = prompt("ใส่หมวดหมู่ (cafe / ev / travel):", "cafe") || "cafe";

      markersData.push({
        id: Date.now(),
        name: name,
        category: category,
        lat: parseFloat(lat),
        lng: parseFloat(lng),
        desc: desc
      });
      renderMarkers(markersData);
    });

    window.filterMarkers = function() {
      const cat = document.getElementById('categoryFilter').value;
      if (cat === 'all') {
        renderMarkers(markersData);
      } else {
        renderMarkers(markersData.filter(i => i.category === cat));
      }
    };

    renderMarkers(markersData);
  </script>
</body>
</html>
