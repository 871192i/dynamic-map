<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปัก-ปัน (Puk-Pan) - แผนที่ชุมชน</title>
    <!-- Tailwind CSS สำหรับตกแต่งหน้าเว็บ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS สำหรับแสดงแผนที่ -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="bg-gray-50 flex flex-col h-screen">

    <!-- Navbar ส่วนหัว -->
    <header class="bg-emerald-600 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">📍 ปัก-ปัน (Puk-Pan)</h1>
        <div id="auth-section" class="flex items-center space-x-3">
            <span id="user-name" class="text-sm hidden"></span>
            <button id="login-btn" onclick="loginWithGoogle()" class="bg-white text-emerald-700 px-4 py-2 rounded-lg font-medium shadow hover:bg-emerald-50 transition">
                เข้าสู่ระบบด้วย Google
            </button>
            <button id="logout-btn" onclick="logout()" class="bg-red-500 text-white px-3 py-1.5 rounded-lg text-sm hidden hover:bg-red-600 transition">
                ออกจากระบบ
            </button>
        </div>
    </header>

    <!-- พื้นที่แสดงแผนที่ -->
    <main class="flex-1 relative">
        <div id="map" class="w-full h-full z-0"></div>
    </main>

    <!-- Firebase App (Modular SDK CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ค่า Config จากที่คุณให้มา
        const firebaseConfig = {
          apiKey: "AIzaSyBup4KDjEO51H5prLfYSWu9DuaMXCMPbp4",
          authDomain: "pukpan-app-9d3ab.firebaseapp.com",
          projectId: "pukpan-app-9d3ab",
          storageBucket: "pukpan-app-9d3ab.firebasestorage.app",
          messagingSenderId: "257779785523",
          appId: "1:257779785523:web:1b6fbe19fdadabf520a846",
          measurementId: "G-0DDTH6M8KD"
        };

        // เริ่มต้นใช้งาน Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // ฟังก์ชันเข้าสู่ระบบด้วย Google
        window.loginWithGoogle = function() {
            signInWithPopup(auth, provider)
                .then((result) => {
                    console.log("Login สำเร็จ:", result.user.displayName);
                })
                .catch((error) => {
                    console.error("Login Error:", error.message);
                    alert("เกิดข้อผิดพลาดในการเข้าสู่ระบบ: " + error.message);
                });
        };

        // ฟังก์ชันออกจากระบบ
        window.logout = function() {
            signOut(auth).then(() => {
                console.log("ออกจากระบบแล้ว");
            }).catch((error) => {
                console.error("Logout Error:", error);
            });
        };

        // ตรวจสอบสถานะการล็อกอินของผู้ใช้แบบ Real-time
        onAuthStateChanged(auth, (user) => {
            const loginBtn = document.getElementById('login-btn');
            const logoutBtn = document.getElementById('logout-btn');
            const userName = document.getElementById('user-name');

            if (user) {
                // กรณีล็อกอินแล้ว
                loginBtn.classList.add('hidden');
                userName.textContent = `สวัสดี, ${user.displayName}`;
                userName.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');
            } else {
                // กรณียังไม่ล็อกอิน
                loginBtn.classList.remove('hidden');
                userName.classList.add('hidden');
                logoutBtn.classList.add('hidden');
            }
        });
    </script>

    <!-- Leaflet JS สำหรับควบคุมแผนที่ -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ตั้งค่าเริ่มต้นแผนที่ (พิกัดประเทศไทย)
        const map = L.map('map').setView([13.736717, 100.523186], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
    </script>
</body>
</html>
