<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ปักแจ้ง (PukJaeng) - ชุมชนแจ้งเหตุสตรีทเรียลไทม์</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    #map { height: 100vh; width: 100%; z-index: 1; }
    .sidebar { z-index: 1000; }
    .modal-overlay { z-index: 2000; }
  </style>
</head>
<body class="bg-gray-100 flex flex-col md:flex-row h-screen overflow-hidden select-none">

  <!-- Sidebar ด้านซ้าย / แถบเครื่องมือบนมือถือ -->
  <div class="sidebar w-full md:w-96 bg-white p-4 shadow-xl flex flex-col gap-3 overflow-y-auto h-auto max-h-[45vh] md:max-h-full border-r">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-3xl">🚨</span>
        <div>
          <h1 class="text-lg font-extrabold text-gray-800">ปักแจ้ง (PukJaeng)</h1>
          <p class="text-[10px] text-blue-600 font-semibold">แจ้งเหตุเตือนภัย & สภาพน้ำท่วมเรียลไทม์</p>
        </div>
      </div>
      <!-- ปุ่ม Admin Mode -->
      <button onclick="toggleAdminLogin()" id="adminBtn" class="text-xs bg-gray-100 hover:bg-gray-200 px-2.5 py-1.5 rounded-lg border font-medium text-gray-700 flex items-center gap-1">
        🔒 แอดมิน
      </button>
    </div>

    <!-- ปุ่มปักแจ้งเหตุใหญ่สำหรับมือถือ -->
    <button onclick="enablePinMode()" id="pinModeBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl shadow-md flex items-center justify-center gap-2 transition active:scale-95">
      <span class="text-xl">📍</span> แตะบนแผนที่เพื่อปักแจ้งเหตุ
    </button>

    <!-- ตัวกรองหมวดหมู่ -->
    <div>
      <div class="flex justify-between items-center mb-1">
        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">กรองประเภทเหตุการณ์:</label>
        <button onclick="addCustomCategory()" id="addCatBtn" class="hidden text-[10px] text-blue-600 font-bold hover:underline">+ เพิ่มหมวดหมู่ (Admin)</button>
      </div>
      <select id="categoryFilter" class="w-full p-2 border rounded-xl text-xs bg-gray-50 font-medium outline-none" onchange="filterMarkers()">
        <option value="all">🚨 เหตุการณ์ทั้งหมด</option>
        <option value="flood">🌊 น้ำท่วม / รอการระบาย</option>
        <option value="accident">⚠️ อุบัติเหตุ / กิ่งไม้ขวางทาง</option>
        <option value="utility">🔌 ไฟฟ้า / ประปาขัดข้อง</option>
        <option value="help">🆘 ขอความช่วยเหลือด่วน</option>
      </select>
    </div>

    <hr class="border-gray-200">

    <!-- รายการแจ้งเหตุเรียลไทม์ -->
    <div class="flex-1">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-xs font-bold text-gray-700">รายการแจ้งเหตุสด (<span id="locationCount">0</span>)</h2>
        <span class="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded-full font-semibold">หายเองใน 24h</span>
      </div>
      <div id="locationList" class="space-y-2 max-h-48 md:max-h-[calc(100vh-280px)] overflow-y-auto pr-1"></div>
    </div>
  </div>

  <!-- พื้นที่แสดงแผนที่ -->
  <div class="flex-1 relative">
    <div id="map"></div>
  </div>

  <!-- Modal ป๊อปอัปฟอร์มแจ้งเหตุบนมือถือ (เน้นกด Choice / ไม่ต้องพิมพ์เยอะ) -->
  <div id="reportModal" class="modal-overlay fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl overflow-y-auto max-h-[90vh]">
      <div class="flex justify-between items-center border-b pb-3 mb-3">
        <h3 class="font-bold text-base text-gray-800 flex items-center gap-2">📍 รายละเอียดการแจ้งเหตุ</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>

      <form id="reportForm" onsubmit="saveReport(event)" class="space-y-4">
        <!-- ประเภทเหตุการณ์ -->
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">1. ประเภทเหตุการณ์</label>
          <select id="formCategory" class="w-full p-2.5 border rounded-xl text-sm bg-gray-50 font-medium" onchange="toggleFloodOptions()">
            <option value="flood">🌊 น้ำท่วม / รอการระบาย</option>
            <option value="accident">⚠️ อุบัติเหตุ / กิ่งไม้ขวางทาง</option>
            <option value="utility">🔌 ไฟฟ้า / ประปาขัดข้อง</option>
            <option value="help">🆘 ขอความช่วยเหลือด่วน</option>
          </select>
        </div>

        <!-- แถบเลื่อนระดับน้ำ (แสดงเฉพาะเมื่อเลือกน้ำท่วม) -->
        <div id="floodSliderGroup" class="bg-blue-50 p-3 rounded-xl border border-blue-100">
          <div class="flex justify-between text-xs font-bold text-blue-900 mb-1">
            <span>🌊 ระดับน้ำขัง:</span>
            <span id="waterLevelLabel" class="text-blue-600 font-extrabold">20 ซม. (ระดับข้อเท้า)</span>
          </div>
          <input type="range" id="waterLevel" min="0" max="100" value="20" step="5" class="w-full accent-blue-600 cursor-pointer" oninput="updateWaterLabel(this.value)">
        </div>

        <!-- ปุ่ม Choice สภาพการจราจร (ไม่ต้องพิมพ์) -->
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1.5">2. การสัญจรของรถยนต์</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="selectPassable('รถเล็กผ่านได้')" id="passBtn1" class="pass-btn p-2 text-xs border rounded-xl font-medium text-center bg-green-50 border-green-300 text-green-700">🚗 รถเล็กผ่านได้</button>
            <button type="button" onclick="selectPassable('เฉพาะรถใหญ่/ยกสูง')" id="passBtn2" class="pass-btn p-2 text-xs border rounded-xl font-medium text-center bg-yellow-50 border-yellow-300 text-yellow-700">🚚 เฉพาะรถใหญ่</button>
            <button type="button" onclick="selectPassable('สัญจรไม่ได้')" id="passBtn3" class="pass-btn p-2 text-xs border rounded-xl font-medium text-center bg-red-50 border-red-300 text-red-700">⛔ ผ่านไม่ได้</button>
          </div>
          <input type="hidden" id="passableValue" value="รถเล็กผ่านได้">
        </div>

        <!-- อัปโหลดรูปถ่าย / ถ่ายรูปจากมือถือ -->
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">3. ถ่ายภาพ / แนบรูปเหตุการณ์</label>
          <input type="file" id="imageInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event)">
          <button type="button" onclick="document.getElementById('imageInput').click()" class="w-full border-2 border-dashed border-gray-300 p-3 rounded-xl text-xs text-gray-600 flex items-center justify-center gap-2 hover:bg-gray-50 transition">
            <span class="text-lg">📷</span> <span id="uploadBtnText">กดเพื่อถ่ายรูป หรือเลือกภาพจากแกลเลอรี</span>
          </button>
          <div id="imagePreviewContainer" class="hidden mt-2 relative">
            <img id="imagePreview" class="w-full h-32 object-cover rounded-xl border">
            <button type="button" onclick="removeImage()" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-6 h-6 text-xs font-bold">&times;</button>
          </div>
        </div>

        <!-- รายละเอียดเพิ่มเติม (Optional) -->
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">4. รายละเอียดเพิ่มเติม (ถ้ามี)</label>
          <input type="text" id="formDesc" placeholder="เช่น บริเวณหน้าปากซอย 5" class="w-full p-2.5 border rounded-xl text-xs bg-gray-50">
        </div>

        <p class="text-[10px] text-gray-400">💡 คำเตือน: คุณสามารถกดลากหมุดบนแผนที่เพื่อปรับพิกัดให้แม่นยำได้ก่อนกดบันทึก</p>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="w-1/3 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold py-3 rounded-xl">ยกเลิก</button>
          <button type="submit" class="w-2/3 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-3 rounded-xl shadow-md">บันทึกการแจ้งเหตุ</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ตั้งค่าเริ่มต้นระบบแผนที่
    const map = L.map('map').setView([13.7563, 100.5018], 12);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let isAdmin = false;
    let tempMarker = null;
    let uploadedImageData = "";
    let tempCoords = null;

    const NOW = Date.now();
    const HOUR_MS = 3600 * 1000;

    let reportsData = [
      {
        id: 1,
        category: "flood",
        waterLevel: 30,
        passable: "เฉพาะรถใหญ่/ยกสูง",
        desc: "ขังรอการระบาย หน้าตลาด",
        imgUrl: "https://images.unsplash.com/photo-1547683905-f686c993aae5?w=400&q=80",
        lat: 13.7563,
        lng: 100.5018,
        createdAt: NOW,
        expiresAt: NOW + (24 * HOUR_MS)
      }
    ];

    let currentMarkersOnMap = [];

    // ฟังก์ชันเลื่อนเปิด Admin
    window.toggleAdminLogin = function() {
      if (isAdmin) {
        isAdmin = false;
        alert("ออกจากโหมด Admin เรียบร้อยแล้ว");
        document.getElementById('adminBtn').innerText = "🔒 แอดมิน";
        document.getElementById('addCatBtn').classList.add('hidden');
      } else {
        const password = prompt("กรุณากรอกรหัสผ่าน Admin:");
        if (password === "1234") { // ตั้งรหัสผ่าน Admin ตรงนี้
          isAdmin = true;
          alert("เข้าสู่โหมด Admin สำเร็จ! คุณสามารถกดลบหมุดของคนไม่หวังดีได้แล้ว");
          document.getElementById('adminBtn').innerText = "🔓 โหมดแอดมิน (ใช้งานอยู่)";
          document.getElementById('addCatBtn').classList.remove('hidden');
        } else if (password !== null) {
          alert("รหัสผ่านไม่ถูกต้อง");
        }
      }
      renderMarkers(reportsData);
    };

    // ปรับแต่ง Label ระดับน้ำ
    window.updateWaterLabel = function(val) {
      let desc = "ระดับข้อเท้า";
      if (val > 25 && val <= 50) desc = "ระดับครึ่งแข้ง / ท่อไอเสีย";
      else if (val > 50 && val <= 75) desc = "ระดับหัวเข่า / ท่วมครึ่งล้อ";
      else if (val > 75) desc = "ระดับเอว / สูงอันตราย";
      document.getElementById('waterLevelLabel').innerText = `${val} ซม. (${desc})`;
    };

    // ปุ่ม Choice การสัญจร
    window.selectPassable = function(val) {
      document.getElementById('passableValue').value = val;
      document.querySelectorAll('.pass-btn').forEach(b => b.classList.remove('ring-2', 'ring-blue-500', 'font-bold'));
      event.target.classList.add('ring-2', 'ring-blue-500', 'font-bold');
    };

    // อัปโหลด/ถ่ายรูปจากมือถือ
    window.handleImageUpload = function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          uploadedImageData = event.target.result;
          document.getElementById('imagePreview').src = uploadedImageData;
          document.getElementById('imagePreviewContainer').classList.remove('hidden');
          document.getElementById('uploadBtnText').innerText = "เปลี่ยนรูปถ่าย";
        };
        reader.readAsDataURL(file);
      }
    };

    window.removeImage = function() {
      uploadedImageData = "";
      document.getElementById('imageInput').value = "";
      document.getElementById('imagePreviewContainer').classList.add('hidden');
      document.getElementById('uploadBtnText').innerText = "กดเพื่อถ่ายรูป หรือเลือกภาพจากแกลเลอรี";
    };

    // เปิด Modal ปักหมุดแบบลากย้ายได้
    map.on('click', function(e) {
      tempCoords = e.latlng;
      
      if (tempMarker) map.removeLayer(tempMarker);
      
      // หมุดสีแดงลากได้ (Draggable Marker)
      tempMarker = L.marker(tempCoords, { draggable: true }).addTo(map);
      tempMarker.bindPopup("📍 **ลากหมุดนี้เพื่อปรับตำแหน่งให้เป๊ะได้ครับ**").openPopup();

      tempMarker.on('dragend', function(event) {
        tempCoords = event.target.getLatLng();
      });

      document.getElementById('reportModal').classList.remove('hidden');
    });

    window.closeModal = function() {
      document.getElementById('reportModal').classList.add('hidden');
      if (tempMarker) map.removeLayer(tempMarker);
    };

    // บันทึกข้อมูล
    window.saveReport = function(e) {
      e.preventDefault();
      const category = document.getElementById('formCategory').value;
      const waterLevel = document.getElementById('waterLevel').value;
      const passable = document.getElementById('passableValue').value;
      const desc = document.getElementById('formDesc').value || "ไม่มีรายละเอียดเพิ่ม";

      const newReport = {
        id: Date.now(),
        category: category,
        waterLevel: category === 'flood' ? waterLevel : null,
        passable: passable,
        desc: desc,
        imgUrl: uploadedImageData,
        lat: tempCoords.lat,
        lng: tempCoords.lng,
        createdAt: Date.now(),
        expiresAt: Date.now() + (24 * HOUR_MS)
      };

      reportsData.unshift(newReport);
      closeModal();
      removeImage();
      renderMarkers(reportsData);
      alert("ปักแจ้งเหตุเรียบร้อยแล้ว! ขอบคุณที่ร่วมช่วยแจ้งเตือนชุมชนครับ");
    };

    // วาดหมุดลงบนแผนที่
    function renderMarkers(data) {
      currentMarkersOnMap.forEach(m => map.removeLayer(m));
      currentMarkersOnMap = [];

      const listContainer = document.getElementById('locationList');
      listContainer.innerHTML = '';

      const activeData = data.filter(item => item.expiresAt > Date.now());
      document.getElementById('locationCount').innerText = activeData.length;

      activeData.forEach(item => {
        const marker = L.marker([item.lat, item.lng]).addTo(map);

        let deleteBtnHTML = isAdmin ? `<button onclick="deleteReport(${item.id})" class="mt-2 w-full bg-red-100 text-red-600 font-bold py-1 rounded text-xs">🗑️ ลบหมุดนี้ (Admin)</button>` : '';

        const popupHTML = `
          <div class="w-56 p-1">
            ${item.imgUrl ? `<img src="${item.imgUrl}" class="w-full h-28 object-cover rounded-lg mb-2">` : ''}
            <h4 class="font-bold text-xs text-blue-700">${item.category === 'flood' ? `🌊 น้ำท่วมขัง ${item.waterLevel} ซม.` : '🚨 แจ้งเตือนเหตุ'}</h4>
            <p class="text-[11px] font-semibold text-gray-800 mt-0.5">🚦 ${item.passable}</p>
            <p class="text-[10px] text-gray-500 mt-1">${item.desc}</p>
            ${deleteBtnHTML}
          </div>
        `;

        marker.bindPopup(popupHTML);
        currentMarkersOnMap.push(marker);

        // Sidebar List
        const card = document.createElement('div');
        card.className = "p-2.5 border rounded-xl bg-white shadow-sm flex gap-2 cursor-pointer hover:border-blue-300";
        card.innerHTML = `
          ${item.imgUrl ? `<img src="${item.imgUrl}" class="w-12 h-12 rounded-lg object-cover flex-shrink-0">` : '<div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center text-lg flex-shrink-0">📍</div>'}
          <div class="flex-1 min-w-0">
            <h5 class="font-bold text-xs text-gray-800 truncate">${item.category === 'flood' ? `น้ำท่วม ${item.waterLevel} ซม.` : 'แจ้งเหตุ'}</h5>
            <p class="text-[10px] text-blue-600 font-medium truncate">${item.passable}</p>
            <p class="text-[10px] text-gray-400 truncate">${item.desc}</p>
          </div>
        `;

        card.onclick = () => {
          map.flyTo([item.lat, item.lng], 15);
          marker.openPopup();
        };

        listContainer.appendChild(card);
      });
    }

    // แอดมินลบหมุดไม่พึงประสงค์
    window.deleteReport = function(id) {
      if (confirm("คุณแน่ใจหรือไม่ว่าต้องการลบหมุดแจ้งเหตุนี้?")) {
        reportsData = reportsData.filter(r => r.id !== id);
        renderMarkers(reportsData);
        alert("ลบหมุดเรียบร้อยแล้ว");
      }
    };

    window.addCustomCategory = function() {
      const newCat = prompt("กรอกชื่อหมวดหมู่ใหม่ที่ต้องการเพิ่มในระบบ:");
      if (newCat) {
        const select = document.getElementById('categoryFilter');
        const opt = document.createElement('option');
        opt.value = newCat;
        opt.innerText = "📌 " + newCat;
        select.appendChild(opt);
        alert(`เพิ่มหมวดหมู่ "${newCat}" เรียบร้อยแล้ว`);
      }
    };

    renderMarkers(reportsData);
  </script>
</body>
</html>
